[project]
name = "knowledge-gathering"
version = "0.1.0"
description = "Knowledge-Gathering Test Agent — read-only Atlassian crawler with a GCS markdown memory bank, driven over A2A."
requires-python = ">=3.12"

# Minimal runtime deps. Pin a2a-sdk to an exact version at M0 once the served
# well-known path (/.well-known/agent-card.json vs /.well-known/agent.json) is confirmed.
dependencies = [
  "a2a-sdk[http-server,postgresql]>=1.1,<2",   # http-server = ASGI app; postgresql = SQLAlchemy+asyncpg for the durable DatabaseTaskStore
  "cloud-sql-python-connector[asyncpg]>=1.4,<2",  # dials Cloud SQL via IAM+TLS (NOT the /cloudsql socket, which never reaches a Cloud Run sidecar) — see common/taskstore.py
  "fastapi>=0.110",                 # the agent server app (FastAPI, a superset of Starlette)
  "httpx>=0.27",
  "google-cloud-storage>=2.16",
  "google-cloud-secret-manager>=2.20",
  "anthropic[vertex]>=1,<2",    # Claude on Vertex AI (claude-sonnet-5) — the Distill step
  "beautifulsoup4>=4.12",
  "uvicorn[standard]>=0.30",
  "graphifyy>=0.9,<1",              # local tree-sitter code-graph CLI (`graphify`) — the codegraph fetcher
]

[project.optional-dependencies]
# The A2A->MCP bridge (client-side, run next to Claude). The agent server does NOT need this.
bridge = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mcp>=2,<3"]
# The LLM-judged eval tier (tests/eval, nightly / `eval:` label). The deterministic PR gate
# (trajectory + node-overlap) needs NONE of these — install only for the judged job. Absent → the
# RAGAS tests skip cleanly (see tests/eval/metrics/ragas_judge.available()).
eval = ["ragas>=0.2", "pandas>=2", "datasets>=2", "google-adk>=1.22"]

# Each `*-bridge` launches that agent's stdio MCP bridge (same as `python -m <pkg>.bridge`).
[project.scripts]
knowledge-gathering-bridge = "knowledge_gathering.bridge.__main__:main"
test-plan-definition-bridge = "test_plan_definition.bridge.__main__:main"
test-evaluation-bridge = "test_evaluation.bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/knowledge_gathering", "src/test_plan_definition", "src/test_evaluation"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Domain models are named Test* (TestPlan, TestData, TestScenario, TestStep) and would
# otherwise trip pytest's default `Test*` class-collection heuristic. The suite uses only
# function-style tests, so require a `*Tests` suffix for class collection instead.
python_classes = ["*Tests"]
