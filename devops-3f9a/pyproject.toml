[project]
name = "devops-3f9a"
version = "0.1.0"
description = "GKE DevOps assistant for LUZ ops (klara-nonprod/performance/infra/repo)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "google-adk==1.28.0",
    "mcp==1.26.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.93.0",
    "google-cloud-container>=2.55.0",
    "kubernetes>=31.0.0",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devops_3f9a"]
